cors:
  allow_any_origin: true
  expose_headers:
    - logged-in
    - identity
supergraph:
  listen: 127.0.0.1:4000
  introspection: true
  path: /*wildcard
  # path: /graphql
health_check:
  listen: 127.0.0.1:4000
  enabled: true
  path: /.well-known/apollo/server-health
sandbox:
  enabled: true
homepage:
  enabled: false
include_subgraph_errors:
  all: true # Propagate errors from all subraphs
plugins:
  experimental.expose_query_plan: true
